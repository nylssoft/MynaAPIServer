services:
  postgres:
    image: postgres:17
    container_name: myna-postgres
    environment:
      POSTGRES_DB: apiserver
      POSTGRES_USER: apiserver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - myna-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiserver -d apiserver"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  myna-postgres-data: